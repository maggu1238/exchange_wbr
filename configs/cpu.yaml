# Exchange WBR — CPU Report Configuration
#
# Input files: drop xlsx files into input/ using the naming convention:
#   CPU_<device-tag>_<timeframe>.xlsx  (case-insensitive)
#
#   Device tags:  mob, tv, ac, ref, wm
#   Timeframes:   weekly, monthly, quarterly, pytd

devices:

  mobile:
    title: "CPU (Mobiles)"
    segments: [overall, generalist, specialist]
    timeframes: [weekly, monthly, quarterly, pytd]
    reasons:
      overall:
        pre_pdd:
          - "check order status tracking"
          - "request for early delivery"
          - "reschedule delivery"
        pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "request for early delivery"
        post_pdd:
          - "check order status tracking"
          - "check refund status"
          - "late shipment"
      generalist:
        pre_pdd:
          - "check order status tracking"
          - "request for early delivery"
          - "check refund status"
        pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "request for early delivery"
        post_pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "late shipment"
      specialist:
        pre_pdd:
          - "check order status tracking"
          - "request for early delivery"
          - "reschedule delivery"
        pdd:
          - "check order status tracking"
          - "request for early delivery"
          - "reschedule delivery"
        post_pdd:
          - "check order status tracking"
          - "late shipment"
          - "check refund status"

  tv:
    title: "CPU (TV)"
    segments: [overall]
    timeframes: [weekly, monthly, quarterly, pytd]
    reasons:
      overall:
        pre_pdd:
          - "customer unaware of already scheduled service slot"
          - "brand provider has not contacted for service"
          - "installation slot confirmed but no one came for installation"
        pdd:
          - "exchange cancellation refund issue"
          - "check refund status"
          - "undeliverable"
        post_pdd:
          - "exchange cancellation refund issue"
          - "convert exchange to regular order"
          - "undeliverable"

  ac:
    title: "CPU (AC)"
    segments: [overall]
    timeframes: [weekly, monthly, quarterly, pytd]
    reasons:
      overall:
        pre_pdd:
          - "check order status tracking"
          - "customer unaware of already scheduled service slot"
          - "brand provider has not contacted for service"
        pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "undeliverable"
        post_pdd:
          - "undeliverable"
          - "invalid scan   delivery attempted  customer reject"
          - "payment declined"

  refrigerator:
    title: "CPU (Refrigerator)"
    segments: [overall]
    timeframes: [weekly, monthly, quarterly, pytd]
    reasons:
      overall:
        pre_pdd:
          - "check order status tracking"
          - "customer unaware of already scheduled service slot"
          - "brand provider has not contacted for service"
        pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "undeliverable"
        post_pdd:
          - "check refund status"
          - "check order status tracking" 
          - "blanks"

  wm:
    title: "CPU (Washing Machine)"
    segments: [overall]
    timeframes: [weekly, monthly, quarterly, pytd]
    reasons:
      overall:
        pre_pdd:
          - "check order status tracking"
          - "customer unaware of already scheduled service slot"
          - "brand provider has not contacted for service"
        pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "undeliverble"
        post_pdd:
          - "check refund status"
          - "check order status tracking"
          - "blanks"
  laptop:
    title: "CPU (Laptop)"
    segments: [overall]
    timeframes: [weekly, monthly, quarterly, pytd]
    reasons:
      overall:
        pre_pdd:
          - "check order status tracking"
          - "reschedule delivery"
          - "request for early delivery"
        pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "request for early delivery"
        post_pdd:
          - "check order status tracking"
          - "invalid scan   delivery attempted  customer reject"
          - "late shipment"
