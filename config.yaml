# Exchange WBR — Global Configuration
#
# Lists which metrics to process when run.py is executed.
# Each metric has its own:
#   - transform_<metric>.py   (transformation logic)
#   - configs/<metric>.yaml   (metric-specific config)
#   - input/<metric>/         (input xlsx files)
#   - output/<metric>/        (generated reports)

metrics:
